<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attraction - Pori Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Edit Attraction</h1>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <form action="/admin/edit_attraction/{{ attraction.id }}" method="POST" class="space-y-4">
                <div>
                    <label for="name" class="block text-gray-700">Name</label>
                    <input type="text" id="name" name="name" value="{{ attraction.name }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="location" class="block text-gray-700">Location</label>
                    <input type="text" id="location" name="location" value="{{ attraction.location }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="description" class="block text-gray-700">Description</label>
                    <textarea id="description" name="description" class="w-full px-4 py-2 border rounded-md" rows="4" required>{{ attraction.description }}</textarea>
                </div>
                <div>
                    <label for="activities" class="block text-gray-700">Activities (comma-separated)</label>
                    <input type="text" id="activities" name="activities" value="{{ attraction.activities }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="best_time_to_visit" class="block text-gray-700">Best Time to Visit</label>
                    <input type="text" id="best_time_to_visit" name="best_time_to_visit" value="{{ attraction.best_time_to_visit }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="rates_citizens" class="block text-gray-700">Rates for Citizens (Ksh)</label>
                    <input type="text" id="rates_citizens" name="rates_citizens" value="{{ attraction.rates_citizens }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="rates_residents" class="block text-gray-700">Rates for Residents (Ksh)</label>
                    <input type="text" id="rates_residents" name="rates_residents" value="{{ attraction.rates_residents }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="rates_non_residents" class="block text-gray-700">Rates for Non-Residents (Ksh)</label>
                    <input type="text" id="rates_non_residents" name="rates_non_residents" value="{{ attraction.rates_non_residents }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="latitude" class="block text-gray-700">Latitude</label>
                    <input type="number" step="any" id="latitude" name="latitude" value="{{ attraction.latitude }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <div>
                    <label for="longitude" class="block text-gray-700">Longitude</label>
                    <input type="number" step="any" id="longitude" name="longitude" value="{{ attraction.longitude }}" class="w-full px-4 py-2 border rounded-md" required>
                </div>
                <button type="submit" class="bg-black text-white px-4 py-2 rounded-md hover:bg-orange-600">Update Attraction</button>
                <a href="/admin_page" class="ml-4 text-gray-600 hover:underline">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
