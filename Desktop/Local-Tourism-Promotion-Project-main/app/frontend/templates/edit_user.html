<!-- frontend/templates/edit_user.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pori - Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #F3F4F6; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Edit User</h2>
            <form action="{{ url_for('admin_edit_user', user_id=user.id) }}" method="POST" class="space-y-6">
                <div>
                    <label for="full_name" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label for="password" class="block text-gray-700 font-semibold mb-2">New Password (optional)</label>
                    <input type="password" id="password" name="password" placeholder="Leave blank to keep current"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded-md hover:bg-orange-600 transition">
                    Save Changes
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="{{ url_for('admin_page') }}" class="text-orange-500 hover:underline">Back to Dashboard</a>
            </div>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="mt-4 text-center text-red-500">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
