<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pori - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Custom styles for consistency */
        body {
            background-color: #F3F4F6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Sign In Section -->
    <div class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
            <div class="flex justify-center mb-6">
                <div class="flex items-center">
                    <span class="text-yellow-400 text-3xl mr-3">🌞</span>
                    <span class="text-2xl font-bold text-gray-800">Pori</span>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Sign In</h2>
            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 text-gray-700 placeholder-gray-400">
                </div>
                <div>
                    <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 text-gray-700 placeholder-gray-400">
                </div>
                <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded-md hover:bg-orange-600 transition focus:outline-none focus:ring-2 focus:ring-orange-500">
                    Sign In
                </button>
            </form>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mt-4 text-center text-{{ 'green-500' if category == 'success' else 'red-500' }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Google Sign-In -->
            <div class="mt-6 text-center">
                <a href="/auth0_login" class="w-full bg-red-600 text-white py-2 rounded-md hover:bg-red-700 transition flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-red-500">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </a>
            </div>

            <!-- Link to Sign Up -->
            <div class="mt-4 text-center">
                <p class="text-gray-600">Don't have an account? <a href="/signup" class="text-orange-500 hover:underline">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
